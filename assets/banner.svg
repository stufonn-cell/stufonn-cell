<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">Miguel Ángel Cano Salinas</title>
  <desc id="desc">Business Intelligence Analyst, Data Analytics Professor and AI automation builder. An animated data pipeline moves records from sources through bronze, silver and gold layers into insights.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#121a2f"/>
    </linearGradient>
    <linearGradient id="nameGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#36bcf7"/>
      <stop offset="1" stop-color="#a371f7"/>
    </linearGradient>
    <linearGradient id="barGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#36bcf7"/>
      <stop offset="1" stop-color="#a371f7" stop-opacity=".55"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#1c2640" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="frame"><rect width="1200" height="320" rx="18"/></clipPath>
    <path id="flow" d="M 660 92 H 1120"/>
  </defs>

  <style>
    .sans { font-family: 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; }
    .mono { font-family: SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace; }
    .up { opacity: 0; animation: up .9s cubic-bezier(.2, .7, .2, 1) forwards; }
    .d1 { animation-delay: .1s; }
    .d2 { animation-delay: .35s; }
    .d3 { animation-delay: .6s; }
    .d4 { animation-delay: .85s; }
    .d5 { animation-delay: 1.1s; }
    .d6 { animation-delay: 1.35s; }
    @keyframes up { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
    .cursor { animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
  </style>

  <!-- background -->
  <g clip-path="url(#frame)">
    <rect width="1200" height="320" fill="url(#bg)"/>
    <rect width="1200" height="320" fill="url(#grid)" opacity=".6"/>
    <circle cx="1060" cy="30" r="170" fill="#36bcf7" opacity=".07">
      <animate attributeName="r" values="160;185;160" dur="8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="110" cy="310" r="190" fill="#a371f7" opacity=".07">
      <animate attributeName="r" values="190;165;190" dur="9s" repeatCount="indefinite"/>
    </circle>
  </g>
  <rect x=".5" y=".5" width="1199" height="319" rx="18" fill="none" stroke="#30363d"/>

  <!-- intro text -->
  <g class="sans">
    <text x="64" y="90" class="mono up d1" font-size="17" fill="#36bcf7">&gt; hello, world. I'm</text>
    <text x="61" y="150" class="up d2" font-size="54" font-weight="700" fill="#e6edf3">Miguel Ángel</text>
    <text x="61" y="208" class="up d3" font-size="54" font-weight="700" fill="url(#nameGrad)">Cano Salinas</text>
    <text x="64" y="250" class="up d4" font-size="19" fill="#9aa4af">BI Analyst · Data Analytics Professor · AI Automation</text>
    <text x="64" y="282" class="mono up d5" font-size="15" fill="#6e7681">Medellín, Colombia <tspan class="cursor" fill="#36bcf7">▌</tspan></text>
  </g>

  <!-- pipeline -->
  <g class="up d4">
    <text x="620" y="50" class="mono" font-size="13" fill="#6e7681">// medallion pipeline · always running</text>

    <line x1="660" y1="92" x2="1120" y2="92" stroke="#30363d" stroke-width="2" stroke-dasharray="4 6">
      <animate attributeName="stroke-dashoffset" from="20" to="0" dur="1s" repeatCount="indefinite"/>
    </line>

    <!-- particles travel under the nodes and change colour inside each layer -->
    <g filter="url(#glow)">
      <circle r="4.5" fill="#e6edf3">
        <animateMotion dur="4s" repeatCount="indefinite" begin="0s"><mpath href="#flow"/></animateMotion>
        <animate attributeName="fill" dur="4s" repeatCount="indefinite" begin="0s" calcMode="discrete" keyTimes="0;.25;.5;.75" values="#e6edf3;#cd7f32;#dfe3e8;#ffd700"/>
      </circle>
      <circle r="4.5" fill="#e6edf3">
        <animateMotion dur="4s" repeatCount="indefinite" begin="-1s"><mpath href="#flow"/></animateMotion>
        <animate attributeName="fill" dur="4s" repeatCount="indefinite" begin="-1s" calcMode="discrete" keyTimes="0;.25;.5;.75" values="#e6edf3;#cd7f32;#dfe3e8;#ffd700"/>
      </circle>
      <circle r="4.5" fill="#e6edf3">
        <animateMotion dur="4s" repeatCount="indefinite" begin="-2s"><mpath href="#flow"/></animateMotion>
        <animate attributeName="fill" dur="4s" repeatCount="indefinite" begin="-2s" calcMode="discrete" keyTimes="0;.25;.5;.75" values="#e6edf3;#cd7f32;#dfe3e8;#ffd700"/>
      </circle>
      <circle r="4.5" fill="#e6edf3">
        <animateMotion dur="4s" repeatCount="indefinite" begin="-3s"><mpath href="#flow"/></animateMotion>
        <animate attributeName="fill" dur="4s" repeatCount="indefinite" begin="-3s" calcMode="discrete" keyTimes="0;.25;.5;.75" values="#e6edf3;#cd7f32;#dfe3e8;#ffd700"/>
      </circle>
    </g>

    <g class="sans" font-size="15" font-weight="600" text-anchor="middle">
      <rect x="620" y="73" width="80" height="38" rx="9" fill="#161b22" stroke="#8b949e" stroke-width="1.5"/>
      <text x="660" y="97" fill="#c9d1d9">Sources</text>

      <rect x="735" y="73" width="80" height="38" rx="9" fill="#161b22" stroke="#cd7f32" stroke-width="1.5">
        <animate attributeName="stroke-opacity" values="1;.35;1" dur="4s" begin="0s" repeatCount="indefinite"/>
      </rect>
      <text x="775" y="97" fill="#cd7f32">Bronze</text>

      <rect x="850" y="73" width="80" height="38" rx="9" fill="#161b22" stroke="#dfe3e8" stroke-width="1.5">
        <animate attributeName="stroke-opacity" values="1;.35;1" dur="4s" begin="-1s" repeatCount="indefinite"/>
      </rect>
      <text x="890" y="97" fill="#dfe3e8">Silver</text>

      <rect x="965" y="73" width="80" height="38" rx="9" fill="#161b22" stroke="#ffd700" stroke-width="1.5">
        <animate attributeName="stroke-opacity" values="1;.35;1" dur="4s" begin="-2s" repeatCount="indefinite"/>
      </rect>
      <text x="1005" y="97" fill="#ffd700">Gold</text>

      <rect x="1080" y="73" width="80" height="38" rx="9" fill="#0f2a3a" stroke="#36bcf7" stroke-width="1.5" filter="url(#glow)"/>
      <text x="1120" y="97" fill="#36bcf7">Insights</text>

      <g font-size="13" font-weight="400" fill="#6e7681">
        <text x="660" y="132">CSV · APIs</text>
        <text x="775" y="132">raw</text>
        <text x="890" y="132">validated</text>
        <text x="1005" y="132">curated</text>
        <text x="1120" y="132">dashboards</text>
      </g>
    </g>
  </g>

  <!-- impact card -->
  <g class="up d6">
    <rect x="620" y="158" width="540" height="128" rx="12" fill="#161b22" stroke="#30363d"/>
    <text x="642" y="183" class="mono" font-size="13" fill="#6e7681">// impact</text>

    <g class="sans">
      <text x="642" y="228" font-size="34" font-weight="700" fill="#ffd700">$8K+</text>
      <text x="642" y="252" font-size="14" fill="#9aa4af">saved per month</text>
      <text x="642" y="271" font-size="14" fill="#6e7681">by an AI agent</text>

      <text x="780" y="228" font-size="34" font-weight="700" fill="#36bcf7">50%+</text>
      <text x="780" y="252" font-size="14" fill="#9aa4af">cost reduction</text>
      <text x="780" y="271" font-size="14" fill="#6e7681">via open source</text>
    </g>

    <line x1="915" y1="176" x2="915" y2="270" stroke="#30363d"/>

    <!-- animated bar chart -->
    <g fill="url(#barGrad)">
      <rect x="936" y="230" width="16" height="40" rx="3">
        <animate attributeName="height" values="40;66;30;40" dur="3.2s" repeatCount="indefinite"/>
        <animate attributeName="y" values="230;204;240;230" dur="3.2s" repeatCount="indefinite"/>
      </rect>
      <rect x="962" y="214" width="16" height="56" rx="3">
        <animate attributeName="height" values="56;34;72;56" dur="3.2s" begin="-.4s" repeatCount="indefinite"/>
        <animate attributeName="y" values="214;236;198;214" dur="3.2s" begin="-.4s" repeatCount="indefinite"/>
      </rect>
      <rect x="988" y="222" width="16" height="48" rx="3">
        <animate attributeName="height" values="48;70;40;48" dur="3.2s" begin="-.8s" repeatCount="indefinite"/>
        <animate attributeName="y" values="222;200;230;222" dur="3.2s" begin="-.8s" repeatCount="indefinite"/>
      </rect>
      <rect x="1014" y="206" width="16" height="64" rx="3">
        <animate attributeName="height" values="64;42;78;64" dur="3.2s" begin="-1.2s" repeatCount="indefinite"/>
        <animate attributeName="y" values="206;228;192;206" dur="3.2s" begin="-1.2s" repeatCount="indefinite"/>
      </rect>
      <rect x="1040" y="218" width="16" height="52" rx="3">
        <animate attributeName="height" values="52;76;46;52" dur="3.2s" begin="-1.6s" repeatCount="indefinite"/>
        <animate attributeName="y" values="218;194;224;218" dur="3.2s" begin="-1.6s" repeatCount="indefinite"/>
      </rect>
      <rect x="1066" y="200" width="16" height="70" rx="3">
        <animate attributeName="height" values="70;50;80;70" dur="3.2s" begin="-2s" repeatCount="indefinite"/>
        <animate attributeName="y" values="200;220;190;200" dur="3.2s" begin="-2s" repeatCount="indefinite"/>
      </rect>
      <rect x="1092" y="210" width="16" height="60" rx="3">
        <animate attributeName="height" values="60;80;54;60" dur="3.2s" begin="-2.4s" repeatCount="indefinite"/>
        <animate attributeName="y" values="210;190;216;210" dur="3.2s" begin="-2.4s" repeatCount="indefinite"/>
      </rect>
      <rect x="1118" y="196" width="16" height="74" rx="3">
        <animate attributeName="height" values="74;56;84;74" dur="3.2s" begin="-2.8s" repeatCount="indefinite"/>
        <animate attributeName="y" values="196;214;186;196" dur="3.2s" begin="-2.8s" repeatCount="indefinite"/>
      </rect>
    </g>
    <line x1="930" y1="270.5" x2="1142" y2="270.5" stroke="#30363d"/>

    <!-- trend line that redraws itself -->
    <path d="M 944 214 L 970 200 L 996 206 L 1022 188 L 1048 194 L 1074 178 L 1100 182 L 1126 166" fill="none" stroke="#ffd700" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" pathLength="300" stroke-dasharray="300" stroke-dashoffset="300">
      <animate attributeName="stroke-dashoffset" values="300;0;0;300" keyTimes="0;.45;.85;1" dur="5s" repeatCount="indefinite"/>
    </path>
    <circle cx="1126" cy="166" r="4" fill="#ffd700" filter="url(#glow)">
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.4;.45;.85;1" dur="5s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
